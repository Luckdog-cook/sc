name: 刷新订阅并部署

on:
  schedule:
    # 每 6 小时刷新一次（分钟错开整点，避开 GitHub 排队高峰）
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成订阅产物
        run: python3 build.py
        env:
          SC_ACCOUNT: ${{ secrets.SC_ACCOUNT }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}
          SUB_SECRET: ${{ secrets.SUB_SECRET }}

      - name: 提交节点更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist worker/src/data.js worker/wrangler.toml
          if git diff --staged --quiet; then
            echo "订阅内容没有变化，跳过提交"
          else
            git commit -m "chore: 刷新订阅 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 部署到 Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
