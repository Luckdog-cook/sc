name: 刷新订阅并部署

on:
  # 推代码就跑一次（订阅文件是本工作流自己提交的，要排除，避免套娃）
  push:
    branches: [main, master]
    paths-ignore:
      - 'dist/**'
      - 'shadowcat.txt'
      - 'shadowcat.yaml'
      - 'shadowcat.json'
  schedule:
    # 每 6 小时刷新一次（分钟错开整点，避开 GitHub 排队高峰）
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # 有 CF 凭据就顺带部署 Worker；没有也照样产出 GitHub 静态订阅
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成订阅产物
        run: python3 build.py
        env:
          SC_ACCOUNT: ${{ secrets.SC_ACCOUNT }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}
          SUB_SECRET: ${{ secrets.SUB_SECRET }}

      - name: 提交节点更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist shadowcat.txt shadowcat.yaml shadowcat.json \
              worker/src/data.js worker/wrangler.toml
          if git diff --staged --quiet; then
            echo "订阅内容没有变化，跳过提交"
          else
            git commit -m "chore: 刷新订阅 $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi

      - name: 部署到 Cloudflare Worker
        if: env.HAS_CF == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: 刷新 jsDelivr 缓存
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          for f in txt yaml json; do
            curl -s -X POST "https://purge.jsdelivr.net/gh/$REPO@$BRANCH/shadowcat.$f" \
              -H "User-Agent: shadowcat-sub" -o /dev/null || true
          done
          echo "已请求刷新 CDN 缓存"

      - name: 输出订阅地址
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          SECRET=$(grep -oP '(?<=SUB_SECRET = ")[^"]+' worker/wrangler.toml)
          OWNER=$(echo "$REPO" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')
          RNAME=$(echo "$REPO" | cut -d/ -f2)
          JS="https://cdn.jsdelivr.net/gh/$REPO@$BRANCH/shadowcat"
          IO="https://$OWNER.github.io/$RNAME/shadowcat"
          {
            echo "## ShadowCat 订阅地址"
            echo ""
            echo "### GitHub Pages（最短）"
            echo ""
            echo "| 类型 | 地址 |"
            echo "|---|---|"
            echo "| 通用订阅 base64 | \`$IO.txt\` |"
            echo "| Clash | \`$IO.yaml\` |"
            echo "| sing-box | \`$IO.json\` |"
            echo ""
            echo "### jsDelivr CDN（国内更稳）"
            echo ""
            echo "| 类型 | 地址 |"
            echo "|---|---|"
            echo "| 通用订阅 base64 | \`$JS.txt\` |"
            echo "| Clash | \`$JS.yaml\` |"
            echo "| sing-box | \`$JS.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HAS_CF" = "true" ]; then
            {
              echo ""
              echo "### Cloudflare Worker（已部署，带密钥校验）"
              echo ""
              echo "地址见上一步 deploy 日志里 wrangler 输出的 URL，拼上："
              echo ""
              echo '```'
              echo "/shadowcat.txt?token=$SECRET"
              echo "/clash.yaml?token=$SECRET"
              echo "/?token=$SECRET"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo ""
              echo "---"
              echo ""
              echo "未配置 Cloudflare 凭据，只用 GitHub 静态订阅。"
              echo "想要**带密钥校验**的订阅（隐私更好），去仓库"
              echo "Settings → Secrets 添加 \`CLOUDFLARE_API_TOKEN\` 和 \`CLOUDFLARE_ACCOUNT_ID\`，"
              echo "下次运行会自动部署 Worker。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "----- 订阅地址 -----"
          echo "Pages    通用: $IO.txt"
          echo "Pages    Clash: $IO.yaml"
          echo "jsDelivr 通用: $JS.txt"
          echo "jsDelivr Clash: $JS.yaml"
          echo "--------------------"
