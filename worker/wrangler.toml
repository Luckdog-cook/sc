# Cloudflare Worker 配置
# SUB_SECRET 是订阅密钥，改了它所有已发出的订阅链接都会失效。
name = "shadowcat-sub"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# 自定义域名（可选）：先把域名托管到 Cloudflare，再取消注释
# routes = [
#   { pattern = "你的域名.com", custom_domain = true }
# ]

[vars]
SUB_SECRET = "rvx9dup71q"

[observability]
enabled = true
